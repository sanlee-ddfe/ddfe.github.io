{% assign n = include.item %}
<a class="news-card" href="{{ '/news/' | relative_url }}#{{ n.date | append: ' ' | append: n.title | slugify }}">
  <div class="news-card-img">
    {% if n.images %}<img src="{{ n.images[0] | relative_url }}" alt="" loading="lazy">{% endif %}
  </div>
  <div class="news-card-body">
    {% if n.date %}<span class="eyebrow">{{ n.date }}</span>{% endif %}
    <h3>{{ n.title }}</h3>
  </div>
</a>
