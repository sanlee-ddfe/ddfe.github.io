{% assign n = include.item %}
<article class="news-item{% unless n.images %} no-image{% endunless %}">
  {% if n.images %}
  <div class="news-media">
    {% for img in n.images %}
    <img src="{{ img | relative_url }}" alt="{{ n.title | strip_html | escape }}" loading="lazy">
    {% endfor %}
  </div>
  {% endif %}
  <div class="news-body">
    {% if n.date %}<span class="news-date">{{ n.date }}</span>{% endif %}
    <h3>{{ n.title }}</h3>
    {% if n.subtitle %}<p class="news-subtitle">{{ n.subtitle }}</p>{% endif %}
    {% if n.body %}<div class="news-text">{{ n.body | markdownify }}</div>{% endif %}
  </div>
</article>
