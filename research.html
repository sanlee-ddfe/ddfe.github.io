---
layout: default
title: Research
permalink: /research/
---
{% assign R = site.data.research %}

<section class="content">
  <div class="container">
    <p class="research-intro">{{ R.intro }}</p>
    <div class="keyword-row">
      {% for k in R.keywords %}<span class="keyword{% if forloop.first %} keyword-main{% endif %}">{{ k }}</span>{% endfor %}
    </div>

    <ol class="themes">
      {% for t in R.themes %}{% include research-theme.html theme=t %}{% endfor %}
    </ol>

    <div class="cta">
      <p>Interested in a joint project? Let's talk.</p>
      <a class="button" href="mailto:{{ site.email }}?subject=Research%20collaboration%20with%20DDFE">Contact us</a>
    </div>
  </div>
</section>
