# ------------------------------------------------------------
# Research page (/research/)
#
#   intro:      one-line mission statement
#   keywords:   tags shown under the intro
#   themes:
#     title:      theme name
#     impact:     one sentence
#     highlights: key papers / projects (label shown, url optional)
#     partners:   sponsors / collaborators (one line)
#     earlier:    true -> listed under "Earlier research" at the bottom
