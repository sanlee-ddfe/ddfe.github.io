- date: 2026-Nov
  title: Accepted in Journal of Computational Physics
  subtitle: Heteroscedastic Residual Learning for Dynamic Adaptive Mesh Refinement in Bluff-Body Wake Flows
  body: |
    Jiwon, Minhyeok and Jongmin's paper has been accepted in *Journal of Computational Physics*. Their deep-learning adaptive mesh refinement (DL-AMR) places mesh resolution using a learned uncertainty map, matching or outperforming classical refinement indicators at 23% of the fine-mesh cost.
