- title: New Publication in POF
  subtitle: Data-driven discovery of drag-inducing elements on a rough surface through convolutional neural networks
  body: |
    New publication in Physics of Fluids (POF)! We developed a CNN that predicts drag forces on rough surfaces using only topography data through an international collaboration (INHA, KTH (Sweden), and KIT (Germany)). Our model reveals key patterns linked to drag, offering insights into fluid dynamics without needing complex parameters. Check out how we're advancing data-driven drag prediction ([Link](https://pubs.aip.org/aip/pof/article-abstract/36/9/095172/3314249/Data-driven-discovery-of-drag-inducing-elements-on))!
  images:
    - /assets/images/news/2024-pof-rough-surface.jpg

