- title: New Publication in ICHMT
  subtitle: Neural network-based thermal model for virtual metrology of lunar orbiter temperatures via active and transfer learning
  body: |
    We developed a neural network-based thermal model for Korea's first lunar orbiter, *Danuri*, enabling real-time temperature prediction from the ground. By combining active and transfer learning, our model achieves high accuracy with drastically reduced computation time—serving as a digital twin for spacecraft thermal monitoring. This joint work with POSTECH and KARI pushes the frontier of AI-driven virtual metrology for space missions. Check our work at: [[link]](https://www.sciencedirect.com/science/article/pii/S0735193325004816)
  images:
    - /assets/images/news/ichmt-lunar-orbiter.jpg

