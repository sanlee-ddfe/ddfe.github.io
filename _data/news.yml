- date: 2026-April
  title: Accepted in Engineering Applications of Artificial Intelligence
  subtitle: Zernike-Aware Neural Networks for Accurate Wafer Map Prediction in Chemical Vapor Deposition Processes
  body: |
    Our lab is pleased to announce that the paper **"Zernike-Aware Neural Networks for Accurate Wafer Map Prediction in Chemical Vapor Deposition Processes"** has been accepted for publication in Engineering Applications of Artificial Intelligence. This study proposes a hybrid deep learning framework, Soft-Zernike Neural Network (SZNN), that integrates a Zernike polynomial-based reduced-order model (Z-Reg) with conditional predictive neural networks (CNN, c-GAN, c-DDIM) for accurate wafer map prediction in semiconductor CVD processes. By injecting a physics-aware low-order structural prior into the learning process, SZNN effectively addresses the critical challenge of data scarcity in semiconductor manufacturing, suppressing common failure modes such as overfitting, mode collapse, and hallucination. Validated on both industrial and CFD-generated datasets, the proposed framework consistently outperforms conventional data-driven models in prediction accuracy and training stability—demonstrating strong potential as a practical surrogate for real-time process optimization and quality control in advanced semiconductor fabrication.
  images:
    - /assets/images/news/2026-04-eaai-zernike.jpg

