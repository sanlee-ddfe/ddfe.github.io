- date: 2026-March
  title: NRF Young Investigator (Type B) Grant Awarded
  subtitle: Quantum-Inspired Physics-Operator AI in Fluid Mechanics
  body: |
    Our lab has been awarded a research grant from the National Research Foundation of Korea (NRF) under the Young Investigator Program (Type B). The project *"Quantum-Inspired Physical-Operator-AI for Next-Generation Fluid Simulation"* will be conducted over five years. This research aims to develop advanced fluid analysis methods by integrating physics-informed AI, operator learning, and quantum-inspired modeling.
  images:
    - /assets/images/news/2026-03-nrf-grant.jpg

- date: 2026-March
  title: New Publication in Engineering Applications of Artificial Intelligence
  subtitle: "Task-aware evolution in physics-informed neural networks: Application to Saint-Venant torsion problems"
  body: |
    Our lab is pleased to announce that the paper **"Task-aware evolution in physics-informed neural networks: Application to Saint-Venant torsion problems"** has been published in *Engineering Applications of Artificial Intelligence*. This study proposes a task-aware PINN framework that combines standard PINN, variable-scaling PINN (VS-PINN), and parametric PINN to accurately and efficiently solve Saint-Venant torsion problems. The approach achieves high accuracy for complex cross-sections, significantly improves stability for stiff geometric transitions, and enables retraining-free, real-time predictions across varying torque conditions—demonstrating strong potential as a mesh-free alternative to FEM for engineering design and optimization.
  images:
    - /assets/images/news/2026-03-eaai-pinn.jpg

- date: 2026-Jan
  title: New Publication in Advances in Engineering Software
  subtitle: An efficient multiscale coupling method for simulations of reactor-scale chemical vapor deposition with microstructural features
  body: |
    Our lab is pleased to announce that our paper, ***"An efficient multiscale coupling method for simulations of reactor-scale chemical vapor deposition with microstructural features"*** has been published in *Advances in Engineering Software* [[link](https://www.sciencedirect.com/science/article/pii/S0965997825001899)], with contributions from collaborators at POSTECH and Samsung Electronics. This work presents a high-fidelity multiscale CVD modeling framework that couples a full 3D reactor-scale model with a parameterized feature-scale model through an effective reaction-rate formulation. The proposed method significantly reduces computational cost while maintaining high accuracy, enabling practical large-scale CVD simulations.
  images:
    - /assets/images/news/2026-01-aes-cvd.jpg

- date: 2026-Jan
  title: New Publication in Future Generation Computer Systems
  subtitle: Towards a widespread usage of computational fluid dynamics simulations for automated virtual nasal surgery planning
  body: |
    Our lab is pleased to announce that the paper ***"Towards a widespread usage of computational fluid dynamics simulations for automated virtual nasal surgery planning"*** has been published in *Future Generation Computer Systems* [[link](https://www.sciencedirect.com/science/article/pii/S0167739X25002304)]. This work was led by Dr. Mario Rüttgers, with contributions from collaborators at RWTH Aachen, University of Latvia, Kobe University, RIKEN, and Forschungszentrum Jülich. The study introduces an efficient hybrid lattice-Boltzmann and level-set–based CFD framework that significantly reduces computational cost for virtual nasal surgery planning. The method enables fast prediction of pressure loss, airflow balance, and tissue-removal implications, making CFD-based surgical planning far more accessible for clinical environments. This publication marks an important advancement toward widespread, automated, and affordable CFD-assisted surgical decision-making.
  images:
    - /assets/images/news/2026-01-fgcs-nasal.jpg

- date: 2025-Dec
  title: New Publication in Physics of Fluids
  subtitle: Comparative analysis of the flow in a realistic human airway
  body: |
    Our lab is pleased to announce that the paper **"Comparative analysis of the flow in a realistic human airway"** has been published in *Physics of Fluids* (2026) [[link](https://pubs.aip.org/aip/pof/article/37/12/121901/3374000)]. Led by Dr. Mario Rüttgers in collaboration with Inha University, RWTH Aachen University, and the Jülich Supercomputing Centre, this study presents an experimentally validated direct numerical simulation of airflow in a realistic human airway, from the nasal cavity to the sixth bronchial bifurcation. Using a high-fidelity lattice-Boltzmann approach, the work reveals how flow instabilities and pressure losses develop across key anatomical regions under different breathing conditions, providing a valuable benchmark for respiratory CFD, diagnostics, and surgical planning.
  images:
    - /assets/images/news/2025-12-pof-airway.jpg

