<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.short_title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  {% include header.html %}
  {% if page.hero %}
  <section class="hero" style="background-image: url('{{ page.hero | relative_url }}');">
    <div class="hero-overlay">
      <h1>{{ page.hero_title | default: site.title }}</h1>
    </div>
  </section>
  {% endif %}
  <main class="site-main">
    {% unless page.hero %}
    <header class="page-header">
      <div class="container"><h1>{{ page.title }}</h1></div>
    </header>
    {% endunless %}
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
